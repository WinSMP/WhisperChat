[versions]
commandapi = "11.2.0"
paper = "26.1.2.build.+"
mockbukkit = "4.115.0"
junit = "6.0.0"
mockito = "5.21.0"
mockito-kotlin = "6.1.0"
junit-launcher = "6.0.0"

[libraries]
commandapi-paper-shade = { module = "dev.jorel:commandapi-paper-shade", version.ref = "commandapi" }
