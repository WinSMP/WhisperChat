public-prefix: "!"

messages:
  # Whisper & DM session messages
  self-whisper-error: "&cYou can't whisper to yourself!"
  dm-start: "&7Started DM session with &3{target}"
  dm-switch: "&7Switched to DM with &3{target}"
  no-dm-sessions: "&cYou have no active DM sessions!"
  no-active-dms: "&cYou have no active DMs."
  invalid-dm-target: "&cNo active DM session with that player!"
  dm-list-header: "&7Active DM sessions:"
  dm-list-item: "&7- &3{target}"
  not-in-dm: "&cYou're not in a DM session!"
  dm-left: "&7Left DM session with &3{target}"
  no-reply-target: "&cNo one to reply to! (DM replies use /dm reply)"
  no-dm-reply-target: "&cNo DM to reply to!"
  target-offline: "&cThat player is offline!"
  session-expired: "&7Your DM session with &3{player}&7 has expired due to inactivity."

  # Group DM messages
  group-deleted: "&4✖ &cDeleted group &3{group}&c! &7Use &3/dm group switch {group} &7to chat here"
  group-joined: "&2✔ &aJoined group &3{group}&a! &7Use &3/dm group switch {group} &7to chat here"
  group-left: "&4⇦ &cLeft group &3{group}&c! &7Use &3/dm group switch {group} &7to chat here"
  group-created: "&b★ &bCreated group &3{group}&b! &7Use &3/dm group switch {group} &7to chat here"
  group-dm-switched: "&9⇨ &7Now chatting in group: &3{group}"
  group-not-exist: "&4⚠ &cThat group doesn't exist!"
  not-in-group: "&4⚠ &cYou're not in that group!"
  cannot-delete-group: "&4✖ &cYou can't delete that group!"
  cannot-join-group: "&4✖ &cYou can't join that group!"
  cannot-leave-group-with-dm: "&4✖ &cUse &3/dm group leave&c to leave groups!"
  group-members: "&7Members of group &3{group}&7:"
  group-owner: "&7Owner: &3{owner}"
  group-no-members: "&7No other members"
  group-members-list: "&7Members:"
  group-member: "&7- &3{member}"

  help:
    - "&3&lWhisperChat Usage"
    - "&3/dm start <player> &7- Start a new DM session"
    - "&3/dm switch <player> &7- Switch active DM session"
    - "&3/dm list &7- List active DM sessions"
    - "&3/dm leave &7- Leave current DM session"
    - "&3/dm reply <message> &7- Reply to the last DM"
    - "&3/w|msg <player> <message> &7- Send a whisper"
    - "&3/r <message> &7- Reply to the last whisper"

formats:
  whisper: "&8[&5W&8]&7 &3{sender} &7» &3{receiver}&8: &f{message}"
  reply: "&8[&5R&8]&7 &3{sender} &7» &3{receiver}&8: &f{message}"
  dm: "&8[&3DM&8]&7 &2{sender} &7» &2{receiver}&8: &f{message}"
  group-dm: "&8[&3{group}&8]&7 &2{sender}&8: &f{message}"

# Valid options:
# - `console`: log messages to console
# - `file`: log messages to file
socialspy: console
